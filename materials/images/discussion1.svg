<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="340" fill="#ffffff" />

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#ced4da" />
    </marker>
  </defs>

  <g transform="translate(50, 20)">
    <rect width="320" height="300" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="160" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#666">既存：構造的メトリクスのみ</text>

    <rect x="80" y="150" width="40" height="100" fill="#adb5bd" />
    <rect x="130" y="100" width="40" height="150" fill="#ced4da" />
    <rect x="180" y="180" width="40" height="70" fill="#adb5bd" />
    <text x="160" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">「現在の状態」に依存</text>
  </g>

  <path d="M 380 170 L 420 170" stroke="#ced4da" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <g transform="translate(430, 20)">
    <rect width="320" height="300" rx="10" fill="#e7f3ff" stroke="#a2d2ff" stroke-width="2"/>
    <text x="160" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0056b3">提案：時系列変化の活用</text>

    <line x1="50" y1="200" x2="270" y2="200" stroke="#0056b3" stroke-width="1" />

    <g stroke="#007bff" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="200" x2="70" y2="160" />
      <line x1="120" y1="200" x2="120" y2="140" />
      <line x1="150" y1="200" x2="150" y2="120" />
      <line x1="170" y1="200" x2="170" y2="110" />
      <line x1="185" y1="200" x2="185" y2="105" />
    </g>

    <g stroke="#dc3545" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="158" x2="120" y2="140" />
      <line x1="150" y1="138" x2="150" y2="120" />
      <line x1="170" y1="118" x2="170" y2="110" />
      <line x1="185" y1="108" x2="185" y2="105" />
    </g>

    <text x="160" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0056b3">「構造の変化」を捉える</text>
  </g>
</svg>
