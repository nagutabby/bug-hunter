<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250">
  <rect width="720" height="250" fill="#ffffff" />

  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: sans-serif; font-size: 12px; fill: #666; }
      .module-base { fill: #E1E4E8; stroke: #A3AAB1; stroke-width: 1.5; }
      .module-add { fill: #FF8C00; stroke: #E67E00; stroke-width: 1.5; }
      .module-diff-zone { fill: #007BFF; stroke: #0056b3; stroke-width: 1.5; opacity: 0.8; }
    </style>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A3AAB1" />
    </marker>
  </defs>

  <line x1="320" x2="320" y1="30" y2="220" stroke="#eee" stroke-width="2" />

  <g transform="translate(15, 50)">
    <text x="0" y="-10" class="title">増分</text>
    <g transform="translate(5, 40)">
      <rect x="0" y="20" width="50" height="40" class="module-base" />
      <rect x="70" y="10" width="40" height="60" class="module-base" />
      <text x="55" y="125" text-anchor="middle" class="label">変更前</text>

      <path d="M125,40 L155,40" fill="none" stroke="#A3AAB1" stroke-width="2" marker-end="url(#arrow-gray)" />

      <g transform="translate(175, 0)">
        <rect x="0" y="20" width="50" height="40" class="module-base" />
        <rect x="0" y="60" width="50" height="30" class="module-add" />

        <rect x="70" y="10" width="40" height="60" class="module-base" />
        <rect x="70" y="-20" width="40" height="30" class="module-add" />
        <text x="55" y="125" text-anchor="middle" class="label">変更後</text>
      </g>
    </g>
  </g>

  <g transform="translate(350, 50)">
    <text x="0" y="-10" class="title">差分</text>
    <g transform="translate(5, 40)">
      <rect x="0" y="20" width="50" height="40" class="module-base" />
      <rect x="80" y="10" width="40" height="60" class="module-base" />
      <text x="60" y="125" text-anchor="middle" class="label">変更前</text>

      <path d="M140,40 L170,40" fill="none" stroke="#A3AAB1" stroke-width="2" marker-end="url(#arrow-gray)" />

      <g transform="translate(190, 0)">
        <rect x="0" y="20" width="50" height="40" class="module-base" />
        <rect x="0" y="30" width="50" height="30" class="module-diff-zone" />

        <rect x="80" y="10" width="40" height="60" class="module-base" />
        <rect x="80" y="10" width="40" height="30" class="module-diff-zone" />
        <text x="60" y="125" text-anchor="middle" class="label">変更後</text>
      </g>
    </g>
  </g>
</svg>
