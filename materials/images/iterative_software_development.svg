<svg width="600" height="340" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" fill="none" />

  <text x="300" y="175" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">反復的開発サイクル</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdc3c7" />
    </marker>
  </defs>

  <g transform="translate(300, 170)">
    <g transform="translate(0, -140)" id="plan">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">計画</text>
    </g>

    <g transform="translate(120, -70)" id="design">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">設計</text>
    </g>

    <g transform="translate(120, 70)" id="impl">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">実装</text>
    </g>

    <g transform="translate(0, 140)" id="test">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">テスト</text>
    </g>

    <g transform="translate(-120, 70)" id="release">
      <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">リリース</text>
    </g>

    <g transform="translate(-120, -70)" id="improve">
      <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#3498db" />
      <text y="5" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">評価・改善</text>
    </g>

    <path d="M 60,-125 Q 95,-115 110,-95" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M 125,-45 Q 135,0 125,45" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M 110,95 Q 95,115 60,125" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M -60,125 Q -95,115 -110,95" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M -125,45 Q -135,0 -125,-45" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M -110,-95 Q -95,-115 -60,-125" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>
</svg>
