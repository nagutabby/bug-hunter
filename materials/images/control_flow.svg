<svg width="400" height="450" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <style>
    .node { fill: #e0f7fa; stroke: #00796b; stroke-width: 2; }
    .decision { fill: #fffde7; stroke: #fbc02d; stroke-width: 2; }
    .edge { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .label { text-anchor: middle; fill: #111; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>

  <g>
    <circle cx="200" cy="50" r="30" class="node"/>
    <text x="200" y="55" class="label">開始</text>
  </g>
  <g>
    <polygon points="200,100 270,150 200,200 130,150" class="decision"/>
    <text x="200" y="155" class="label">if (x > 10)</text>
  </g>
  <g>
    <rect x="50" y="250" width="100" height="50" rx="10" class="node"/>
    <text x="100" y="280" class="label">処理A</text>
  </g>
  <g>
    <rect x="250" y="250" width="100" height="50" rx="10" class="node"/>
    <text x="300" y="280" class="label">処理B</text>
  </g>
  <g>
    <rect x="150" y="350" width="100" height="50" rx="10" class="node"/>
    <text x="200" y="380" class="label">処理C</text>
  </g>

  <path d="M 200 80 C 200 90, 200 90, 200 100" class="edge"/> <path d="M 150 160 C 120 190, 90 220, 100 250" class="edge"/> <text x="120" y="200" class="label" font-size="12">True</text>
  <path d="M 250 160 C 280 190, 310 220, 300 250" class="edge"/> <text x="280" y="200" class="label" font-size="12">False</text>
  <path d="M 100 300 C 100 325, 150 325, 175 350" class="edge"/> <path d="M 300 300 C 300 325, 250 325, 225 350" class="edge"/> </svg>
