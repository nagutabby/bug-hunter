<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .table-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .header-bg { fill: #808080; }
      .cell-stroke { stroke: #000000; stroke-width: 1; }
      .text-label { font-size: 18px; font-weight: normal; text-anchor: middle; }
      .text-content { font-size: 14px; font-weight: normal; text-anchor: middle; }
      .text-header { fill: #ffffff; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <g id="original-data">
    <text x="150" y="40" class="text-label">元のデータ</text>
    <rect x="50" y="60" width="200" height="250" class="table-bg"/>

    <rect x="50" y="60" width="200" height="50" class="header-bg cell-stroke"/>
    <text x="150" y="90" class="text-content text-header">データ行</text>

    <rect x="50" y="110" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="150" y="140" class="text-content">Row 1</text>
    <rect x="50" y="160" width="200" height="50" fill="#808080" class="cell-stroke"/>
    <text x="150" y="190" class="text-content text-header">Row 2</text>
    <rect x="50" y="210" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="150" y="240" class="text-content">Row 3</text>
    <rect x="50" y="260" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="150" y="290" class="text-content">Row 4</text>
    <rect x="50" y="310" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="150" y="340" class="text-content">Row 5</text>
  </g>

  <g id="tree1-data">
    <text x="550" y="40" class="text-label">決定木1の学習データ</text>
    <rect x="450" y="60" width="200" height="250" class="table-bg"/>
    <rect x="450" y="60" width="200" height="50" class="header-bg cell-stroke"/>
    <text x="550" y="90" class="text-content text-header">抽出された行</text>

    <rect x="450" y="110" width="200" height="50" fill="#808080" class="cell-stroke"/>
    <text x="550" y="140" class="text-content text-header">Row 2</text>
    <rect x="450" y="160" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="550" y="190" class="text-content">Row 5</text>
    <rect x="450" y="210" width="200" height="50" fill="#808080" class="cell-stroke"/>
    <text x="550" y="240" class="text-content text-header">Row 2</text>
    <rect x="450" y="260" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="550" y="290" class="text-content">Row 1</text>
    <rect x="450" y="310" width="200" height="50" fill="#ffffff" class="cell-stroke"/>
    <text x="550" y="340" class="text-content">Row 4</text>
  </g>

  <path d="M 260,200 Q 350,150 440,180" class="arrow" marker-end="url(#arrowhead)"/>

</svg>
