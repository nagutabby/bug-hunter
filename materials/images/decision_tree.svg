 <rect x="35" y="120" width="30" height="20" fill="#2196f3" rx="5"/>
 </g>
<!-- 集計エリア -->
 <g transform="translate(325, 280)">
<!-- オレンジクラスの集計 -->
 <text x="75" y="-10" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f57c00">バグあり</text>
 <rect x="0" y="0" width="150" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="12"/>
 <circle cx="40" cy="30" r="12" fill="#ff9800"/>
 <circle cx="110" cy="30" r="12" fill="#ff9800"/>
 <text x="75" y="80" text-anchor="middle" font-family="Arial" font-size="40" font-weight="normal" fill="#f57c00">2</text>
<!-- 青クラスの集計（多数で強調） -->
 <text x="275" y="-10" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#1976d2">バグなし</text>
 <rect x="200" y="0" width="150" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="4" rx="12"/>
 <circle cx="225" cy="25" r="10" fill="#2196f3"/>
 <circle cx="275" cy="25" r="10" fill="#2196f3"/>
 <circle cx="325" cy="25" r="10" fill="#2196f3"/>
 <text x="275" y="80" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold" fill="#1976d2">3</text>
 </g>
</svg>
