<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
 <defs>
 <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
 <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
 </marker>
 </defs>
<!-- 背景 -->
 <rect width="1000" height="500" fill="#f8f9fa"/>
<!-- 決定木1（左端） -->
 <g transform="translate(50, 30)">
 <circle cx="50" cy="20" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
 <circle cx="25" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <circle cx="75" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <line x1="42" y1="35" x2="32" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <line x1="58" y1="35" x2="68" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <rect x="35" y="120" width="30" height="20" fill="#ff9800" rx="5"/>
 </g>
<!-- 決定木2（左寄り） -->
 <g transform="translate(250, 30)">
 <circle cx="50" cy="20" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
 <circle cx="25" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <circle cx="75" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <line x1="42" y1="35" x2="32" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <line x1="58" y1="35" x2="68" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <rect x="35" y="120" width="30" height="20" fill="#2196f3" rx="5"/>
 </g>
<!-- 決定木3（中央） -->
 <g transform="translate(450, 30)">
 <circle cx="50" cy="20" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
 <circle cx="25" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <circle cx="75" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <line x1="42" y1="35" x2="32" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <line x1="58" y1="35" x2="68" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <rect x="35" y="120" width="30" height="20" fill="#2196f3" rx="5"/>
 </g>
<!-- 決定木4（右寄り） -->
 <g transform="translate(650, 30)">
 <circle cx="50" cy="20" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
 <circle cx="25" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <circle cx="75" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <line x1="42" y1="35" x2="32" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <line x1="58" y1="35" x2="68" y2="55" stroke="#2e7d32" stroke-width="3"/>
 <rect x="35" y="120" width="30" height="20" fill="#ff9800" rx="5"/>
 </g>
<!-- 決定木5（右端） -->
 <g transform="translate(850, 30)">
 <circle cx="50" cy="20" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
 <circle cx="25" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <circle cx="75" cy="70" r="15" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
 <line x1="42" y1="35" x2="32" y2="55" stroke="#2e7d32" stroke-width="3"/>
