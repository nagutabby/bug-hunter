<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333" />
    </marker>
  </defs>

  <line x1="100" y1="60" x2="900" y2="60" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="65" font-family="sans-serif" font-size="18" fill="#666">Time</text>

  <rect x="150" y="120" width="180" height="150" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="240" y="150" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#333">Commit n</text>
  <rect x="170" y="170" width="140" height="35" rx="5" fill="#e9ecef" stroke="#ced4da" />
  <text x="240" y="193" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#495057">Method A</text>
  <rect x="170" y="215" width="140" height="35" rx="5" fill="#e9ecef" stroke="#ced4da" />
  <text x="240" y="238" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#495057">Method B</text>

  <line x1="350" y1="205" x2="630" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="500" cy="205" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="500" y="215" font-family="serif" font-weight="bold" font-size="32" text-anchor="middle" fill="#333">Δ</text>
  <text x="500" y="165" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#333">変化量に着目</text>

  <rect x="650" y="120" width="180" height="195" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
  <text x="740" y="150" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#333">Commit n+1</text>
  <rect x="670" y="170" width="140" height="35" rx="5" fill="#e9ecef" stroke="#ced4da" />
  <text x="740" y="193" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#495057">Method A'</text>
  <rect x="670" y="215" width="140" height="35" rx="5" fill="#e9ecef" stroke="#ced4da" />
  <text x="740" y="238" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#495057">Method B'</text>
  <rect x="670" y="260" width="140" height="35" rx="5" fill="#dee2e6" stroke="#adb5bd" />
  <text x="740" y="283" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#495057">Method C (new)</text>

  <path d="M 500 240 L 500 330" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <rect x="350" y="340" width="300" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
  <text x="500" y="370" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">特徴量ベクトル</text>
  <text x="500" y="400" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#666">（行数増分、複雑度変化、分散度など）</text>

  <line x1="500" y1="445" x2="500" y2="490" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="500" width="400" height="60" rx="30" fill="#343a40" />
  <text x="500" y="537" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle" fill="#fff">欠陥混入確率の予測</text>
</svg>
