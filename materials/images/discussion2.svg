<svg width="600" height="250" viewBox="0 30 600 250" xmlns="http://www.w3.org/2000/svg">
  <rect y="30" width="600" height="250" fill="#ffffff" />

  <defs>
    <marker id="arrowSmall" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#dee2e6" />
    </marker>
  </defs>

  <g transform="translate(45, 0)">
    <g transform="translate(100, 145)">
      <circle cx="0" cy="0" r="100" fill="#dee2e6" />
      <text x="0" y="125" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">多数の正常な変更</text>
      <circle cx="-50" cy="-20" r="4" fill="#dee2e6" />
      <circle cx="20" cy="-40" r="4" fill="#dee2e6" />
      <circle cx="-20" cy="30" r="4" fill="#dee2e6" />
      <circle cx="50" cy="10" r="4" fill="#dee2e6" />

      <g>
        <circle cx="40" cy="-20" r="15" fill="#ff4757" />
        <text x="55" y="-55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff4757">少数の欠陥</text>
      </g>
    </g>

    <path d="M 215 145 L 255 145" stroke="#dee2e6" stroke-width="3" marker-end="url(#arrowSmall)"/>

    <g transform="translate(270, 45)">
      <rect width="240" height="200" rx="10" fill="#e7f3ff" stroke="#007bff" stroke-dasharray="5,5"/>
      <text x="120" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#007bff">変更メトリクスによる識別</text>

      <path d="M 40 150 L 100 80 L 160 160 L 200 120" stroke="#007bff" stroke-width="3" fill="none" opacity="0.6"/>
      <circle cx="100" cy="80" r="8" fill="#ff4757" />
      <text x="120" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">「変化の兆候」から少数の欠陥を特定</text>
    </g>
  </g>
</svg>
