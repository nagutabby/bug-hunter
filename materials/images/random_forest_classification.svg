<svg width="600" height="400" style="background: white" xmlns="http://www.w3.org/2000/svg">
  <!-- 軸 -->
  <g transform="translate(0,320)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="black" stroke-width="1"/>
    <!-- X軸目盛り -->
    <g transform="translate(80,0)"><line y2="6" stroke="black"/><text y="20" text-anchor="middle" font-size="12">-50</text></g>
    <g transform="translate(176,0)"><line y2="6" stroke="black"/><text y="20" text-anchor="middle" font-size="12">-25</text></g>
    <g transform="translate(320,0)"><line y2="6" stroke="black"/><text y="20" text-anchor="middle" font-size="12">0</text></g>
    <g transform="translate(464,0)"><line y2="6" stroke="black"/><text y="20" text-anchor="middle" font-size="12">25</text></g>
    <g transform="translate(560,0)"><line y2="6" stroke="black"/><text y="20" text-anchor="middle" font-size="12">50</text></g>
    <text x="320" y="60" text-anchor="middle" font-weight="bold" font-size="14">コード行数の変化量 (ΔLOC)</text>
  </g>

  <g transform="translate(80,0)">
    <line x1="0" y1="40" x2="0" y2="320" stroke="black" stroke-width="1"/>
    <!-- Y軸目盛り -->
    <g transform="translate(0,40)"><line x2="-6" stroke="black"/><text x="-10" y="5" text-anchor="end" font-size="12">30</text></g>
    <g transform="translate(0,110)"><line x2="-6" stroke="black"/><text x="-10" y="5" text-anchor="end" font-size="12">15</text></g>
    <g transform="translate(0,180)"><line x2="-6" stroke="black"/><text x="-10" y="5" text-anchor="end" font-size="12">0</text></g>
    <g transform="translate(0,250)"><line x2="-6" stroke="black"/><text x="-10" y="5" text-anchor="end" font-size="12">-15</text></g>
    <g transform="translate(0,320)"><line x2="-6" stroke="black"/><text x="-10" y="5" text-anchor="end" font-size="12">-30</text></g>
    <text transform="rotate(-90)" x="-180" y="-40" text-anchor="middle" font-weight="bold" font-size="14">循環的複雑度の変化量 (ΔCC)</text>
  </g>

  <!-- タイトル -->
  <text x="300" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">ランダムフォレストによる2値分類</text>

  <!-- 陽性クラス（バグあり）のデータポイント -->
  <!-- 右上象限 -->
  <circle cx="420" cy="120" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="450" cy="100" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="480" cy="80" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="510" cy="60" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="390" cy="140" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="440" cy="90" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="470" cy="110" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="500" cy="70" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="410" cy="130" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="460" cy="95" r="5" fill="#e74c3c" opacity="0.8"/>

  <!-- 左下象限（一部） -->
  <circle cx="150" cy="280" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="120" cy="300" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="140" cy="290" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="110" cy="310" r="5" fill="#e74c3c" opacity="0.8"/>

  <!-- 陰性クラス（バグなし）のデータポイント -->
  <!-- 原点付近 -->
  <circle cx="300" cy="170" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="310" cy="190" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="330" cy="160" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="290" cy="200" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="340" cy="180" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="320" cy="175" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="335" cy="195" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="305" cy="165" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="315" cy="185" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="325" cy="170" r="5" fill="#2ecc71" opacity="0.8"/>

  <!-- リファクタリング領域 -->
  <circle cx="200" cy="220" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="180" cy="240" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="160" cy="250" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="220" cy="210" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="190" cy="230" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="170" cy="245" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="210" cy="225" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="185" cy="235" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="205" cy="215" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="175" cy="240" r="5" fill="#2ecc71" opacity="0.8"/>

  <!-- 決定境界 -->
  <path d="M 95 60 Q 270 272 545 78" stroke="#3498db" stroke-width="3" fill="none" stroke-dasharray="8,4"/>

  <!-- 凡例 -->
  <g transform="translate(400,240)">
    <circle cx="0" cy="0" r="6" fill="#e74c3c"/>
    <text x="15" y="5" font-size="12">陽性クラス（バグあり）</text>

    <circle cx="0" cy="25" r="6" fill="#2ecc71"/>
    <text x="15" y="30" font-size="12">陰性クラス（バグなし）</text>

    <line x1="0" y1="50" x2="30" y2="50" stroke="#3498db" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="35" y="55" font-size="12">決定境界</text>
  </g>
</svg>
