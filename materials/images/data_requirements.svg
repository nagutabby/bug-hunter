<svg width="900" height="450" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </defs>

  <style>
    .panel { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 30; }
    .title { font-family: 'Hiragino Sans', sans-serif; font-weight: bold; font-size: 20px; fill: #000; }
    .box { stroke: #333; stroke-width: 1.5; rx: 4; }
    .box-blue { fill: #ccc; }
    .box-orange { fill: #ccc; }
    .label { font-family: sans-serif; font-size: 13px; fill: #000; text-anchor: middle; }
    .line-red { stroke: #000; stroke-width: 2; marker-end: url(#arrowhead-red); }
  </style>

  <g transform="translate(15, 15)">
    <rect width="280" height="420" class="panel" />
    <text x="140" y="45" class="title" text-anchor="middle">変更プロセスの追跡</text>

    <g transform="translate(100, 100)">
      <rect width="80" height="40" class="box box-blue" />
      <text x="40" y="25" class="label">Module 1</text>

    </g>

    <g transform="translate(20, 195)">
      <rect width="80" height="40" class="box box-blue" />
      <text x="40" y="25" class="label">Module 2</text>
    </g>
    <g transform="translate(100, 280)">
      <rect width="80" height="40" class="box box-blue" />
      <text x="40" y="25" class="label">Module 3</text>
    </g>
    <g transform="translate(185, 335)">
      <rect width="80" height="40" class="box box-blue" />
      <text x="40" y="25" class="label">Module 4</text>
    </g>

    <path d="M110,145 L70,190" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
    <path d="M140,145 L140,275" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
    <path d="M170,145 L215,330" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  </g>

  <g transform="translate(310, 15)">
    <rect width="280" height="420" class="panel" />
    <text x="140" y="45" class="title" text-anchor="middle">混入と修正の対応</text>

    <rect x="25" y="100" width="80" height="40" class="box box-orange" />
    <text x="65" y="125" class="label">Method 1</text>

    <rect x="25" y="180" width="80" height="40" class="box box-orange" />
    <text x="65" y="205" class="label">Method 2</text>

    <rect x="175" y="100" width="80" height="40" class="box box-orange" />
    <text x="215" y="125" class="label">Method 1′</text>

    <rect x="175" y="180" width="80" height="40" class="box box-orange" />
    <text x="215" y="205" class="label">Method 2′</text>

    <rect x="175" y="260" width="80" height="40" class="box box-orange" />
    <text x="215" y="285" class="label">Method 3′</text>

    <path d="M110,120 L170,120" stroke="#555" stroke-width="2" marker-end="url(#arrowhead-orange)" fill="none" />
    <path d="M110,200 L170,200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead-orange)" fill="none" />
    <path d="M110,220 L170,265" stroke="#555" stroke-width="2" marker-end="url(#arrowhead-orange)" fill="none" />
  </g>

  <g transform="translate(605, 15)">
    <rect width="280" height="420" class="panel" />
    <text x="140" y="45" class="title" text-anchor="middle">粒度の低さ</text>

    <rect x="25" y="100" width="80" height="40" class="box box-blue" />
    <text x="65" y="125" class="label">Module 1</text>

    <rect x="25" y="180" width="80" height="40" class="box box-blue" />
    <text x="65" y="205" class="label">Module 2</text>

    <rect x="25" y="335" width="80" height="40" class="box box-blue" />
    <text x="65" y="360" class="label">Module 3</text>

    <rect x="175" y="100" width="80" height="40" class="box box-orange" />
    <text x="215" y="125" class="label">Method 1</text>

    <rect x="175" y="180" width="80" height="40" class="box box-orange" />
    <text x="215" y="205" class="label">Method 2</text>

    <rect x="175" y="260" width="80" height="40" class="box box-orange" />
    <text x="215" y="285" class="label">Method 3</text>

    <rect x="175" y="335" width="80" height="40" class="box box-orange" />
    <text x="215" y="360" class="label">Method 4</text>

    <path d="M110,120 L170,120" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
    <path d="M110,200 L170,200" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
    <path d="M110,355 L170,355" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
    <path d="M110,345 L170,310" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  </g>
</svg>
