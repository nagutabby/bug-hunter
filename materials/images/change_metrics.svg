<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- 変化量の説明 -->
  <g transform="translate(270, 30)">
    <rect width="160" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">変化量</text>
    <rect x="20" y="35" width="60" height="12" fill="#4caf50"/>
    <text x="90" y="45" font-family="Arial" font-size="12" fill="#4caf50">+20行</text>
    <rect x="20" y="50" width="15" height="12" fill="#f44336"/>
    <text x="90" y="60" font-family="Arial" font-size="12" fill="#f44336">-5行</text>
    <rect x="20" y="70" width="50" height="15" fill="#1976d2" opacity="0.8"/>
    <text x="90" y="82" font-family="Arial" font-size="12" fill="black" font-weight="bold">+15行</text>
  </g>

  <!-- 前々回のコミット -->
  <g transform="translate(50, 180)">
    <rect width="140" height="70" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5"/>
    <rect x="10" y="10" width="100" height="6" fill="#666" opacity="0.3"/>
    <rect x="10" y="18" width="90" height="6" fill="#666" opacity="0.3"/>
    <rect x="10" y="26" width="105" height="6" fill="#666" opacity="0.3"/>
    <rect x="10" y="34" width="80" height="6" fill="#666" opacity="0.3"/>
    <rect x="10" y="42" width="95" height="6" fill="#666" opacity="0.3"/>
    <text x="70" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">100行</text>
  </g>

  <!-- 前回のコミット（強調） -->
  <g transform="translate(240, 180)">
    <rect width="140" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="5"/>
    <rect x="10" y="10" width="100" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="18" width="80" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="26" width="90" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="34" width="70" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="42" width="85" height="6" fill="#1976d2" opacity="0.4"/>
    <text x="70" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#1976d2" font-weight="bold">120行</text>
  </g>

  <!-- 今回のコミット（強調） -->
  <g transform="translate(430, 180)">
    <rect width="140" height="70" fill="#e8f5e8" stroke="#2e7d32" stroke-width="3" rx="5"/>
    <rect x="10" y="10" width="100" height="6" fill="#2e7d32" opacity="0.4"/>
    <rect x="10" y="18" width="110" height="6" fill="#4caf50" opacity="0.7"/>
    <rect x="10" y="26" width="90" height="6" fill="#2e7d32" opacity="0.4"/>
    <rect x="10" y="34" width="85" height="6" fill="#4caf50" opacity="0.7"/>
    <rect x="10" y="42" width="95" height="6" fill="#2e7d32" opacity="0.4"/>
    <text x="70" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32" font-weight="bold">135行</text>
  </g>

  <!-- コミット間の矢印 -->
  <path d="M 190 215 L 230 215" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 380 215 L 420 215" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 変化量のテキスト -->
  <text x="310" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" font-weight="bold">+20行</text>
  <text x="500" y="285" text-anchor="middle" font-family="Arial" font-size="12" fill="#ff5722" font-weight="bold">+15行</text>

  <!-- コミットラベル -->
  <text x="120" y="310" text-anchor="middle" font-family="monospace" font-size="12" fill="#666">前々回</text>
  <text x="310" y="310" text-anchor="middle" font-family="monospace" font-size="12" fill="#1976d2" font-weight="bold">前回</text>
  <text x="500" y="310" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e7d32" font-weight="bold">今回</text>

  <!-- 対象期間の強調 -->
  <rect x="230" y="160" width="350" height="100" fill="none" stroke="#ff5722" stroke-width="2" stroke-dasharray="8,4" rx="10"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff5722"/>
    </marker>
  </defs>
</svg>
