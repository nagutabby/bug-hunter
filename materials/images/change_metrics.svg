<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa"/>

  <g transform="translate(320, 30)">
    <rect width="160" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>

    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#333" font-weight="bold">変化量</text>

    <rect x="20" y="35" width="60" height="12" fill="#4caf50"/>
    <text x="90" y="45" font-family="Arial" font-size="12" fill="#4caf50">+20行</text>

    <rect x="20" y="50" width="15" height="12" fill="#f44336"/>
    <text x="90" y="60" font-family="Arial" font-size="12" fill="#f44336">-5行</text>

    <rect x="20" y="70" width="50" height="15" fill="#1976d2" opacity="0.8"/>
    <text x="90" y="82" font-family="Arial" font-size="12" fill="black" font-weight="bold">+15行</text>
  </g>

  <g transform="translate(220, 180)">
    <rect width="160" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    <rect x="10" y="10" width="120" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="18" width="90" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="26" width="110" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="34" width="80" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="42" width="100" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="50" width="85" height="6" fill="#1976d2" opacity="0.4"/>
    <rect x="10" y="58" width="95" height="6" fill="#1976d2" opacity="0.4"/>
    <text x="80" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#1976d2" font-weight="bold">120行</text>
  </g>

  <g transform="translate(420, 180)">
    <rect width="160" height="80" fill="#e8f5e8" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <rect x="10" y="10" width="120" height="6" fill="#2e7d32" opacity="0.4"/>
    <rect x="10" y="18" width="130" height="6" fill="#4caf50" opacity="0.7"/>
    <rect x="10" y="26" width="110" height="6" fill="#2e7d32" opacity="0.4"/>
    <rect x="10" y="34" width="100" height="6" fill="#4caf50" opacity="0.7"/>
    <rect x="10" y="42" width="115" height="6" fill="#2e7d32" opacity="0.4"/>
    <rect x="10" y="50" width="105" height="6" fill="#4caf50" opacity="0.7"/>
    <rect x="10" y="58" width="95" height="6" fill="#2e7d32" opacity="0.4"/>
    <text x="80" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32" font-weight="bold">135行</text>
  </g>

  <line x1="200" y1="320" x2="600" y2="320" stroke="#333" stroke-width="3"/>

  <circle cx="300" cy="320" r="20" fill="#4285f4" stroke="#333" stroke-width="2"/>
  <text x="300" y="350" text-anchor="middle" font-family="monospace" font-size="14" fill="#333">A</text>

  <circle cx="500" cy="320" r="20" fill="#34a853" stroke="#333" stroke-width="2"/>
  <text x="500" y="350" text-anchor="middle" font-family="monospace" font-size="14" fill="#333">B</text>

  <path d="M 320 320 L 480 320" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <path d="M 300 300 L 300 260" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 500 300 L 500 260" stroke="#34a853" stroke-width="2" stroke-dasharray="5,5"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff5722"/>
    </marker>
  </defs>
</svg>
